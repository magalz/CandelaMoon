name: Android SAST (mobsfscan)

on:
  pull_request:
    branches: [moonlight-noir]
    paths:
      - 'app/src/**'
      - 'app/build.gradle'
      - 'app/build.gradle.kts'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  mobsfscan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run mobsfscan
        uses: MobSF/mobsfscan@main   # 0.4.1+
        with:
          args: 'app/src --sarif --output results.sarif'

      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
          category: mobsfscan
